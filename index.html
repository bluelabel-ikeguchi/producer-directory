<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>プロデューサー名鑑</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');

:root{
  --bg:#e0ffff;
  --surface:#f4fffe;
  --text:#0d2b2e;
  --text-muted:#3a7275;
  --line:#b0e8ea;
  --accent:#007b8a;
  --accent-soft:#c4f0f4;
  --teal:#005f6b;
  --teal-soft:#d0f2f5;
  --radius:10px;
}
*{box-sizing:border-box;}
body{ margin:0; background:var(--bg); color:var(--text); font-family:'Noto Sans JP', sans-serif; line-height:1.6; }

#back-to-top{
  position:fixed; right:18px; bottom:18px; z-index:1000;
  display:flex; align-items:center; gap:6px;
  background:var(--accent); color:#fff; border:none; border-radius:999px;
  padding:11px 18px; font-family:inherit; font-size:13px; font-weight:600; cursor:pointer;
  box-shadow:0 3px 12px rgba(0,60,65,0.28);
  opacity:0; visibility:hidden; transform:translateY(10px);
  transition:opacity .2s ease, transform .2s ease, visibility .2s;
}
#back-to-top.show{ opacity:1; visibility:visible; transform:translateY(0); }
#back-to-top:hover{ background:var(--teal); }
#back-to-top .arrow{ font-size:15px; line-height:1; }
.serif{ font-family:'Shippori Mincho', serif; }

.topbar{ position:relative; border-bottom:1px solid var(--line); padding:24px 20px 18px; }
.topbar::before{ content:''; position:absolute; top:0; left:0; right:0; height:4px; background:var(--accent); }
.eyebrow{ display:block; font-size:11px; letter-spacing:0.12em; color:var(--text-muted); margin-bottom:6px; }
.topbar h1{ font-size:21px; font-weight:700; margin:0; }

main{ max-width:680px; margin:0 auto; padding:20px 20px 60px; }

.breadcrumb{ font-size:13px; color:var(--text-muted); margin-bottom:18px; }
.breadcrumb button{ background:#b0e8ea; color:#005f6b; border:none; padding:5px 12px; border-radius:999px; font:inherit; font-size:12px; cursor:pointer; text-decoration:none; }
.breadcrumb button:hover{ background:#8fd8dc; }
.breadcrumb .sep{ margin:0 6px; color:var(--line); }
.breadcrumb .current{ color:var(--text); }

.view{ display:none; }
.view.active{ display:block; }

.list-row{
  background:var(--surface); border:1px solid var(--line); border-radius:14px;
  padding:14px 16px; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between; cursor:pointer;
  box-shadow:0 1px 3px rgba(13,43,46,0.06);
  transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
}
.list-row:hover{ border-color:var(--accent); transform:translateY(-2px); box-shadow:0 8px 18px rgba(13,43,46,0.13); }
.list-row:active{ transform:translateY(0); box-shadow:0 2px 6px rgba(13,43,46,0.10); }
.list-row .label .top{ font-weight:500; font-size:15px; }
.list-row .label .sub{ font-size:12px; color:var(--text-muted); margin-top:3px; }
.chev{ color:var(--text-muted); font-size:18px; flex-shrink:0; margin-left:10px; transition:transform .15s ease; }
.list-row:hover .chev{ transform:translateX(3px); color:var(--accent); }
.row-main{ display:flex; align-items:center; gap:14px; min-width:0; }
.icon-chip{ width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.icon-chip svg{ width:22px; height:22px; display:block; }

.badge{ display:inline-block; font-size:11px; padding:2px 9px; border-radius:999px; background:var(--teal-soft); color:var(--teal); margin-left:8px; }
.badge.next{ background:var(--accent-soft); color:var(--accent); }

.drama-row{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:15px 16px; margin-bottom:10px; display:flex; gap:14px; align-items:flex-start; }
.drama-slot{ min-width:58px; width:58px; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#c4f0f4; border:1.5px solid #5ac8d0; border-radius:8px; padding:8px 4px; flex-shrink:0; gap:1px; }
.drama-slot .slot-day{ font-size:14px; color:#005f6b; font-weight:700; line-height:1.4; }
.drama-slot .slot-time{ font-size:12px; color:#005f6b; font-weight:600; line-height:1.4; }
.drama-body{ flex:1; min-width:0; }
.station-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; padding:4px 0; }
.station-btn{
  background:var(--surface); border:1.5px solid var(--line); border-radius:14px;
  padding:16px 8px; text-align:center; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:96px;
  box-shadow:0 1px 3px rgba(13,43,46,0.06);
  transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
}
.station-btn:hover{ transform:translateY(-3px); box-shadow:0 8px 18px rgba(13,43,46,0.14); border-color:var(--accent); }
.station-btn:active{ transform:translateY(0); box-shadow:0 2px 6px rgba(13,43,46,0.10); }
.station-btn .st-name{ font-size:13px; font-weight:700; color:var(--text); line-height:1.3; word-break:keep-all; }
.station-btn .st-count{ font-size:11px; color:var(--text-muted); margin-top:4px; }
.station-icon-chip{
  width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center;
  margin-bottom:8px; flex-shrink:0;
}
.station-icon-chip svg{ width:22px; height:22px; display:block; }
.period-btn{ background:var(--surface); border:1.5px solid var(--line); border-radius:12px; padding:16px 8px; text-align:center; cursor:pointer; transition:background .15s; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:96px; gap:6px; }
.period-btn:active{ background:var(--accent-soft); }
.period-btn .pb-period{ font-size:14px; font-weight:700; color:var(--text); line-height:1.3; }
.period-btn .pb-station{ font-size:11px; color:var(--text-muted); margin-top:2px; }
.drama-title{ font-weight:500; font-size:15px; margin-bottom:6px; }
.producer-link{ background:none; border:none; padding:0; font:inherit; font-size:13px; color:var(--teal); cursor:pointer; text-decoration:underline; }
.drama-memo{ font-size:12px; color:var(--text-muted); margin-top:6px; }

.profile-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:22px; margin-bottom:20px; display:flex; gap:16px; }
.avatar-lg{ width:72px; height:72px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-size:24px; font-weight:500; flex-shrink:0; }
.profile-name{ font-size:19px; font-weight:700; margin:0 0 4px; }
.profile-meta{ font-size:13px; color:var(--text-muted); margin:0 0 2px; }

.section-title{ font-size:14px; font-weight:500; margin:24px 0 10px; color:var(--text-muted); }
.work-row{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:12px 15px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; }
.work-title{ font-size:14px; }
.work-year{ font-size:12px; color:var(--text-muted); }
.actor-tag{ font-size:11px; padding:3px 9px; border-radius:999px; background:var(--teal-soft); color:var(--teal); white-space:nowrap; }
.empty-note{ font-size:13px; color:var(--text-muted); background:var(--accent-soft); padding:12px 15px; border-radius:var(--radius); }
.search-wrap{ margin-bottom:18px; }
.search-input{
  width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:10px;
  font-family:inherit; font-size:15px; background:var(--surface); color:var(--text);
}
.search-input:focus{ outline:none; border-color:var(--teal); }
a.list-row{ text-decoration:none; color:inherit; }
.video-btn-wrap{ margin-top:14px; display:flex; gap:8px; flex-wrap:wrap; }
.video-btn{ display:inline-flex; align-items:center; gap:4px; background:var(--accent); color:#fff; font-size:13px; padding:9px 16px; border-radius:999px; text-decoration:none; font-weight:500; }
.video-btn:hover{ background:var(--teal); }

</style>
</head>

<script>

// ============================================================
// Google Sheets 動的ローダー（シート名指定方式）
// ============================================================
const _PUBID = '2PACX-1vQpr0q9e0Yv15LjP-5kMq-LuNVoLg6rSjhOJlhwV3gSZrVV7FV7KyR1iVVgXyKwJA';
const _BASE = `https://docs.google.com/spreadsheets/d/e/${_PUBID}`;
const _GID_PRODUCER = '655643429';
const _GID_ACTOR    = '1976248138';
const _STATIONS = ['テレビ朝日','TBS','日本テレビ','フジテレビ','テレビ東京','NHK','WOWOW','Netflix','PrimeVideo','Abema','その他'];

function _parseCSV(text) {
  const rows = []; let row = [], cell = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (ch === '"') {
      if (inQ && text[i+1] === '"') { cell += '"'; i++; }
      else inQ = !inQ;
    } else if (ch === ',' && !inQ) { row.push(cell); cell = ''; }
    else if ((ch === '\r' && text[i+1] === '\n') || (ch === '\n' && text[i-1] !== '\r') || ch === '\r') {
      if (ch === '\r' && text[i+1] === '\n') i++;
      row.push(cell); cell = '';
      if (row.some(v => v)) rows.push(row);
      row = [];
    } else cell += ch;
  }
  if (cell || row.length) { row.push(cell); if (row.some(v=>v)) rows.push(row); }
  return rows;
}

function _csvToDicts(rows) {
  if (!rows.length) return [];
  const headers = rows[0];
  return rows.slice(1).filter(r => r.some(v => v.trim())).map(r => {
    const d = {};
    headers.forEach((h, i) => d[h.trim()] = (r[i] || '').trim());
    return d;
  });
}

async function _fetchSheet(sheetNameOrGid, useGid) {
  const param = useGid
    ? `gid=${sheetNameOrGid}&single=true`
    : `sheet=${encodeURIComponent(sheetNameOrGid)}`;
  const url = `${_BASE}/pub?output=csv&${param}`;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}: ${sheetNameOrGid}`);
  return _csvToDicts(_parseCSV(await r.text()));
}

function _splitNames(s) {
  if (!s) return [];
  return s.split(/[、,，\s]+/).map(n => n.replace(/[、,，]+$/, '').trim()).filter(Boolean);
}

function _calcAge(bdStr) {
  if (!bdStr) return null;
  const m = bdStr.match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);
  if (!m) return null;
  const today = new Date();
  let age = today.getFullYear() - +m[1];
  if (today < new Date(today.getFullYear(), +m[2]-1, +m[3])) age--;
  return age;
}

function _normYear(s) {
  if (!s) return null;
  const m = String(s).match(/(\d{4})/);
  return m ? +m[1] : null;
}

function _fmtTime(s) {
  if (!s) return '';
  return s.trim();
}

async function _buildData(setStatus) {
  const allRows = [];

  for (const sname of _STATIONS) {
    setStatus(`${sname} を読み込み中...`);
    try {
      const rows = await _fetchSheet(sname, false);
      rows.forEach(r => { r._station = sname; allRows.push(r); });
    } catch(e) {
      console.warn('skip', sname, e.message);
    }
  }

  setStatus('プロデューサー情報を読み込み中...');
  const producerRows = await _fetchSheet(_GID_PRODUCER, true);

  setStatus('俳優情報を読み込み中...');
  const actorRows = await _fetchSheet(_GID_ACTOR, true);

  setStatus('データを組み立て中...');

  const coming   = allRows.filter(r => r['ステータス']==='来期' || r['ステータス']==='放送中');
  const finished = allRows.filter(r => r['ステータス']==='終了');

  const dramas = coming.map(r => ({
    title: r['作品名'], station: r['局']||r._station,
    period: r['放送予定']||'', weekday: r['曜日']||'',
    time: _fmtTime(r['時間']), shooting: r['撮影状況']||'',
    producers: _splitNames(r['プロデューサー名']),
    status: r['ステータス'], memo: r['備考']||''
  })).filter(d => d.title);

  const history = finished.map(r => ({
    title: r['作品名'], station: r['局']||r._station,
    year: _normYear(r['放送年']),
    producers: _splitNames(r['プロデューサー名']),
    actors: _splitNames(r['出演俳優名'])
  })).filter(h => h.title);

  const periodsMap = {};
  dramas.forEach(d => {
    const k = d.station+'|'+d.period;
    if (!periodsMap[k]) periodsMap[k] = {station:d.station,period:d.period,status:d.status,dramaTitles:[]};
    periodsMap[k].dramaTitles.push(d.title);
  });

  // プロデューサー名前インデックス
  const pLookup = {};
  producerRows.filter(p=>p['名前']).forEach(p => pLookup[p['名前']]=p);
  const knownProducers = new Set(Object.keys(pLookup));

  // 俳優名（1列目、ヘッダー文字化け対応）
  const actorNameKey = Object.keys(actorRows[0]||{})[0];
  const knownActors = new Set(actorRows.map(a=>a[actorNameKey]||a['名前']).filter(Boolean));

  const producers = producerRows.filter(p=>p['名前']).map(p => {
    const pname = p['名前'];
    const pastWorks = [];
    history.forEach(h => {
      if (h.producers.includes(pname)) {
        h.actors.filter(a=>knownActors.has(a)).forEach(actor => {
          pastWorks.push({title:h.title, year:h.year, actor});
        });
      }
    });
    pastWorks.sort((a,b)=>(b.year||0)-(a.year||0));
    return {
      name:pname, role:p['役職']||'', org:p['局_所属']||'',
      age:p['年齢']||null, hobby:p['趣味']||'', memo:p['備考']||'',
      photo:null, pastWorks
    };
  });

  const actConnMap = {};
  history.forEach(h => {
    h.actors.forEach(aname => {
      if (!knownActors.has(aname)) return;
      h.producers.forEach(pname => {
        if (!knownProducers.has(pname)) return;
        if (!actConnMap[aname]) actConnMap[aname]=[];
        actConnMap[aname].push({
          producer:pname, role:pLookup[pname]?.['役職']||'',
          title:h.title, year:h.year, station:h.station
        });
      });
    });
  });

  const actors = actorRows.filter(a=>(a[actorNameKey]||a['名前'])).map(a => {
    const aname = a[actorNameKey]||a['名前'];
    const bd = a['生年月日']||'';
    return {
      name:aname, age:_calcAge(bd), birthdate:bd,
      height:a['身長']||null, hometown:a['出身']||'',
      skills:a['特技、資格']||'',
      videoUrl1:a['動画URL①']||'', videoUrl2:a['動画URL②']||'',
      connections:(actConnMap[aname]||[]).sort((a,b)=>(b.year||0)-(a.year||0))
    };
  });

  return {
    periods: Object.values(periodsMap),
    dramas, producers, actors, history
  };
}

function _showLoader(msg) {
  let el = document.getElementById('_gs_loader');
  if (!el) {
    el = document.createElement('div');
    el.id = '_gs_loader';
    el.style.cssText = 'position:fixed;inset:0;background:rgba(250,247,242,0.97);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;font-family:"Noto Sans JP",sans-serif;';
    document.body.appendChild(el);
  }
  el.innerHTML = `
    <div style="text-align:center;">
      <div style="width:44px;height:44px;border:4px solid #E2DACB;border-top-color:#2C4A52;border-radius:50%;animation:_spin 0.8s linear infinite;margin:0 auto 20px;"></div>
      <div style="font-size:15px;color:#2C4A52;font-weight:500;margin-bottom:8px;">スプレッドシートから読み込み中</div>
      <div id="_gs_msg" style="font-size:13px;color:#786F62;">${msg||''}</div>
    </div>
    <style>@keyframes _spin{to{transform:rotate(360deg)}}</style>`;
}

function _setMsg(msg) {
  const el = document.getElementById('_gs_msg');
  if (el) el.textContent = msg;
}

function _showError(msg) {
  const el = document.getElementById('_gs_loader');
  if (el) el.innerHTML = `
    <div style="text-align:center;padding:32px;max-width:360px;">
      <div style="font-size:32px;margin-bottom:12px;">⚠️</div>
      <div style="color:#B8392B;font-size:16px;font-weight:500;margin-bottom:8px;">読み込みに失敗しました</div>
      <div style="color:#786F62;font-size:13px;line-height:1.6;margin-bottom:20px;">${msg}</div>
      <button onclick="_initSheets()" style="padding:10px 28px;background:#2C4A52;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;">再試行</button>
    </div>`;
}

async function _initSheets() {
  _showLoader('接続中...');
  try {
    const data = await _buildData(msg => { _showLoader(msg); _setMsg(msg); });
    window._SHEETS_DATA = data;
    // 既存コードのDATAとして使えるようProxyをセット
    document.getElementById('_gs_loader')?.remove();
    goTop();
    renderTop();
  } catch(e) {
    console.error(e);
    _showError(e.message + '<br><br>※ Netlify等のサーバー経由でアクセスしてください。<br>ローカルファイル(file://)では動作しません。');
  }
}

function renderBreadcrumb(){
  const bc = document.getElementById('breadcrumb');
  let html = `<button class="bc-top" onclick="goTop()">TOP</button>`;

  if(state.mode === 'shootingstations'){
    html += `<span class="sep">›</span><span class="current">撮影中番組</span>`;
  }
  if(state.mode === 'shooting'){
    html += `<span class="sep">›</span><button onclick="goShooting()">撮影中番組</button>`;
    if(state.station){
      if(state.producerName){
        html += `<span class="sep">›</span><button onclick="goShootingStation('${state.station}')">${state.station}</button>`;
      }else{
        html += `<span class="sep">›</span><span class="current">${state.station}</span>`;
      }
    }
  }
  if(state.mode === 'stationstop'){
    html += `<span class="sep">›</span><span class="current">番組まとめ</span>`;
  }


  if(state.mode === 'station'){
    html += `<span class="sep">›</span><button onclick="goStationsTop()">番組まとめ</button>`;
    if(state.station){
      if(state.periodKey){
        html += `<span class="sep">›</span><button onclick="goStationPeriods('${state.station}')">${state.station}</button>`;
      }else{
        html += `<span class="sep">›</span><span class="current">${state.station}</span>`;
      }
    }
    if(state.periodKey){
      const p = DATA.periods.find(p=>periodKeyOf(p)===state.periodKey);
      const label = p.period;
      if(state.producerName){
        html += `<span class="sep">›</span><button onclick="goDramaList('${state.periodKey}')">${label}</button>`;
      }else{
        html += `<span class="sep">›</span><span class="current">${label}</span>`;

    }
  }

  if(state.mode === 'actor'){
    if(state.actorName){
      html += `<span class="sep">›</span><button onclick="goActorList()">自社所属俳優</button>`;
      if(state.producerName){
        html += `<span class="sep">›</span><button onclick="goActorProfile('${state.actorName}')">${state.actorName}</button>`;
      }else{
        html += `<span class="sep">›</span><span class="current">${state.actorName}</span>`;
      }
    }else{
      html += `<span class="sep">›</span><span class="current">自社所属俳優</span>`;
    }
  }

  if(state.mode === 'company'){
    if(state.company){
      html += `<span class="sep">›</span><button onclick="goCompanies()">制作会社・事務所別</button>`;
      if(state.producerName){
        html += `<span class="sep">›</span><button onclick="goCompanyPeople('${state.company}')">${state.company}</button>`;
      }else{
        html += `<span class="sep">›</span><span class="current">${state.company}</span>`;
      }

      html += `<span class="sep">›</span><span class="current">制作会社・事務所別</span>`;
    }
  }

  if(state.historyTitle){
    if(state.producerName){
      html += `<span class="sep">›</span><button onclick="goHistoryDrama('${state.historyTitle}')">${state.historyTitle}</button>`;
    }else{
      html += `<span class="sep">›</span><span class="current">${state.historyTitle}</span>`;
    }
  }

  if(state.producerName){
    html += `<span class="sep">›</span><span class="current">${state.producerName}</span>`;
  }
  bc.innerHTML = html;
}

}

function renderSearch(){
  const q = document.getElementById('search-box').value.trim();
  const prodResultsEl = document.getElementById('search-results');
  const actorResultsEl = document.getElementById('actor-search-results');
  const dramaResultsEl = document.getElementById('drama-search-results');
  const restEl = document.getElementById('top-rest');

  if(!q){
    prodResultsEl.innerHTML = '';
    actorResultsEl.innerHTML = '';
    dramaResultsEl.innerHTML = '';
    restEl.style.display = '';
    return;
  }
  restEl.style.display = 'none';

  // --- プロデューサー ---
  const prodMatches = DATA.producers
    .filter(p=> p.name.toLowerCase().includes(q.toLowerCase()))
    .sort((a,b)=> a.name.localeCompare(b.name, 'ja'));
  const prodHtml = prodMatches.map(p=>`
    <div class="list-row" onclick="goProfile('${p.name}')">
      <div class="label">
        <div class="top">${p.name}</div>
        <div class="sub">${p.role} ／ ${p.org}</div>
      </div>
      <div class="chev">›</div>
    </div>
  `).join('');

  // --- 俳優 ---
  const actorMatches = DATA.actors
    .filter(a=> a.name.toLowerCase().includes(q.toLowerCase()))
    .sort((a,b)=> a.name.localeCompare(b.name, 'ja'));
  const actorHtml = actorMatches.map(a=>`
    <div class="list-row" onclick="goActorProfile('${a.name}')">
      <div class="label">
        <div class="top">${a.name}</div>
        <div class="sub">${a.age ? a.age+'歳　' : ''}${a.height ? a.height+'cm　' : ''}${a.hometown || ''}　接点 ${a.connections.length}件</div>
      </div>
      <div class="chev">›</div>
    </div>
  `).join('');

  // --- 作品 ---
  const currentMatches = DATA.dramas
    .filter(d=> d.title.toLowerCase().includes(q.toLowerCase()))
    .sort((a,b)=> a.title.localeCompare(b.title, 'ja'));
  const currentTitles = new Set(currentMatches.map(d=>d.title));
  const seenHistory = new Set();
  const historyMatches = (DATA.history || [])
    .filter(h=> h.title.toLowerCase().includes(q.toLowerCase()) && !currentTitles.has(h.title))
    .filter(h=>{ if(seenHistory.has(h.title)) return false; seenHistory.add(h.title); return true; })
    .sort((a,b)=> a.title.localeCompare(b.title, 'ja'));
  const currentHtml = currentMatches.map(d=>{
    const schedule = [d.weekday, d.time].filter(Boolean).join(' ');
    const sub = [d.station, d.period, schedule].filter(Boolean).join(' ／ ');
    return `
    <div class="list-row" onclick="goDramaList('${periodKeyOf(d)}')">
      <div class="label">
        <div class="top">${d.title}</div>
        <div class="sub">${sub}</div>
      </div>
      <div class="chev">›</div>
    </div>
  `;
  }).join('');
  const historyHtml = historyMatches.map(h=>{
    const sub = [h.station, h.year ? h.year+'年' : ''].filter(Boolean).join(' ／ ');
    return `
    <div class="list-row" onclick="goHistoryDrama('${h.title}')">
      <div class="label">
        <div class="top">${h.title}<span class="badge">過去作品</span></div>
        <div class="sub">${sub}</div>
      </div>
      <div class="chev">›</div>
    </div>
  `;
  }).join('');
  const dramaHtml = currentHtml + historyHtml;

  if(!prodHtml && !actorHtml && !dramaHtml){
    prodResultsEl.innerHTML = `<div class="empty-note">「${q}」に一致する結果が見つかりません。</div>`;
    actorResultsEl.innerHTML = '';
    dramaResultsEl.innerHTML = '';
    return;
  }

  prodResultsEl.innerHTML = prodHtml ? `<div class="section-title">プロデューサー</div>${prodHtml}` : '';
  actorResultsEl.innerHTML = actorHtml ? `<div class="section-title">俳優</div>${actorHtml}` : '';
  dramaResultsEl.innerHTML = dramaHtml ? `<div class="section-title">作品</div>${dramaHtml}` : '';
}

  });

  wrap.innerHTML = `
    <div class="profile-card">
      <div class="avatar-lg" style="background:#0000ff">${actor.name.charAt(0)}</div>
      <div>
        <p class="profile-name">${actor.name}</p>

        ${actor.skills ? `<p class="profile-meta">特技・資格:${actor.skills}</p>` : ''}
        ${videoHtml}
      </div>
    </div>
    <div class="section-title">関わったプロデューサー・キャスティング</div>
    ${connHtml}
  `;
}

function renderIndex(){
  document.getElementById('page-title').textContent = state.station;
  const wrap = document.getElementById('period-list');
  const list = periodsForStation(state.station).slice().sort((a,b)=>{
    const ka = periodSortKey(a), kb = periodSortKey(b);
    return ka[0]-kb[0] || ka[1]-kb[1];
  });
  if(list.length === 0){
    wrap.innerHTML = `<div class="empty-note">まだ作品が登録されていません。</div>`;
    return;
  }
  wrap.innerHTML = '<div class="station-grid">' + list.map(p=>`
    <div class="period-btn" onclick="goDramaList('${periodKeyOf(p)}')">
      <div class="pb-period">${p.period}</div>
      <span class="badge ${p.status==='来期'?'next':''}">${p.status}</span>
      <div class="pb-station">${p.station}</div>
    </div>
  `).join('') + '</div>';
}

function renderCompanies(){
  document.getElementById('page-title').textContent = '制作会社・事務所別';
  const wrap = document.getElementById('company-list');
  const groups = {};
  DATA.producers.forEach(p=>{
    const org = p.org || '所属不明';
    groups[org] = (groups[org] || 0) + 1;
  });
  const orgs = Object.keys(groups).sort((a,b)=> a.localeCompare(b, 'ja'));
  wrap.innerHTML = orgs.map(org=>`
    <div class="list-row" onclick="goCompanyPeople('${org}')">
      <div class="label">
        <div class="top">${org}</div>
        <div class="sub">${groups[org]}名</div>
      </div>
      <div class="chev">›</div>
    </div>
  `).join('');
}

function renderCompanyPeople(){
  document.getElementById('page-title').textContent = state.company;
  const wrap = document.getElementById('company-people-list');
  const people = DATA.producers.filter(p=> (p.org || '所属不明') === state.company)
    .slice().sort((a,b)=> a.name.localeCompare(b.name, 'ja'));
  wrap.innerHTML = people.map(p=>`
    <div class="list-row" onclick="goProfile('${p.name}')">
      <div class="label">
        <div class="top">${p.name}</div>
        <div class="sub">${p.role}</div>
      </div>
      <div class="chev">›</div>
    </div>
  `).join('');
}

function renderDramaList(){
  const p = DATA.periods.find(p=>periodKeyOf(p)===state.periodKey);
  document.getElementById('page-title').textContent = `${p.station} ${p.period}`;
  function dramaYearRank(d){
    const m = (d.period||'').match(/(\d{4})年/);
    return m ? parseInt(m[1]) : 9999;
  }
  const WEEKDAY_ORDER = {'月':0,'火':1,'水':2,'木':3,'金':4,'土':5,'日':6};
  function weekdayRank(d){
    const ch = (d.weekday || '').charAt(0);
    return WEEKDAY_ORDER.hasOwnProperty(ch) ? WEEKDAY_ORDER[ch] : 99;
  }
  const list = DATA.dramas.filter(d=> periodKeyOf(d)===state.periodKey)
    .sort((a,b)=> (dramaYearRank(a)-dramaYearRank(b)) || (weekdayRank(a)-weekdayRank(b)));
  const wrap = document.getElementById('drama-list');
  wrap.innerHTML = list.map(d=>{
    const links = d.producers.map(name=>{
      const prod = DATA.producers.find(x=>x.name===name);
      const label = prod ? `${prod.role}:${name}` : `${name}(プロフィール未登録)`;
      return `<button class="producer-link" onclick="goProfile('${name}')">${label}</button>`;
    }).join('<span style="color:var(--text-muted);margin:0 6px;">/</span>');
    const schedule = [d.weekday, d.time].filter(Boolean).join(' ');
    return `
      <div class="drama-row">
        ${(d.weekday || d.time) ? `<div class="drama-slot"><span class="slot-day">${d.weekday || '−'}</span><span class="slot-time">${(d.time||''). replace(/(\d+時)(\d+分)/, '$1<br>$2')}</span></div>` : ''}
        <div class="drama-body">
          <div class="drama-title">${d.title}</div>
          <div class="drama-memo">${d.station}　${d.period}</div>
          <div>${links}</div>
          ${d.memo ? `<div class="drama-memo">${d.memo}</div>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

function renderProfile(){
  const prod = DATA.producers.find(x=>x.name===state.producerName);
  document.getElementById('page-title').textContent = state.producerName;
  const wrap = document.getElementById('profile-content');

  if(!prod){
    wrap.innerHTML = `<div class="empty-note">${state.producerName}さんはまだ「プロデューサー詳細」シートに登録されていません。年齢・趣味・過去作品を確認するには、Excelにプロフィールを追加してください。</div>`;
    return;
  }

  const sortedPastWorks = prod.pastWorks.slice().sort((a,b)=>{
    const ya = typeof a.year === 'number' ? a.year : -Infinity;
    const yb = typeof b.year === 'number' ? b.year : -Infinity;
    return yb - ya;
  });
  const worksHtml = sortedPastWorks.length === 0
    ? `<div class="empty-note">弊社俳優との過去作品の記録はまだありません。</div>`
    : sortedPastWorks.map(w=>`
        <div class="work-row">
          <div><div class="work-title">${w.title}</div><div class="work-year">${w.year}年${w.station ? ' ／ ' + w.station : ''}</div></div>
          <span class="actor-tag">${w.actor}(弊社)</span>
        </div>
      `).join('');

  function dramaYearRank(d){
    const m = (d.period||'').match(/(\d{4})年/);
    return m ? parseInt(m[1]) : 9999;
  }
  const WEEKDAY_ORDER = {'月':0,'火':1,'水':2,'木':3,'金':4,'土':5,'日':6};
  function weekdayRank(d){
    const ch = (d.weekday || '').charAt(0);
    return WEEKDAY_ORDER.hasOwnProperty(ch) ? WEEKDAY_ORDER[ch] : 99;
  }
  const currentDramas = DATA.dramas.filter(d=>d.producers.includes(prod.name))
    .sort((a,b)=> (dramaYearRank(a)-dramaYearRank(b)) || (weekdayRank(a)-weekdayRank(b)));
  const currentHtml = currentDramas.length === 0
    ? `<div class="empty-note">現在・今後の担当番組の記録はありません。</div>`
    : currentDramas.map(d=>{
        const links = d.producers.filter(name=>name!==prod.name).map(name=>{
          const p2 = DATA.producers.find(x=>x.name===name);
          const label = p2 ? `${p2.role}:${name}` : `${name}(プロフィール未登録)`;
          return `<button class="producer-link" onclick="goProfile('${name}')">${label}</button>`;
        }).join('<span style="color:var(--text-muted);margin:0 6px;">/</span>');
        return `
          <div class="drama-row" style="cursor:pointer;" onclick="goDramaList('${periodKeyOf(d)}')">
            ${(d.weekday || d.time) ? `<div class="drama-slot"><span class="slot-day">${d.weekday || '−'}</span><span class="slot-time">${(d.time||'').replace(/(\d+時)(\d+分)/, '$1<br>$2')}</span></div>` : ''}
            <div class="drama-body">
              <div class="drama-title">${d.title}<span class="badge">${d.status}</span></div>
              <div class="drama-memo">${d.station}　${d.period}</div>
              ${links ? `<div>${links}</div>` : ''}
              ${d.memo ? `<div class="drama-memo">${d.memo}</div>` : ''}
            </div>
          </div>
        `;
      }).join('');

  wrap.innerHTML = `
    <div class="profile-card">
      ${prod.photo ? `<img src="${prod.photo}" style="width:72px;height:72px;border-radius:50%;object-fit:cover;flex-shrink:0;">` : `<div class="avatar-lg" style="background:${colorFor(prod.name)}">${prod.name.charAt(0)}</div>`}
      <div>
        <p class="profile-name">${prod.name}</p>
        <p class="profile-meta">${prod.role} ／ ${prod.org}</p>
        <p class="profile-meta">${prod.age}歳</p>
        <p class="profile-meta">趣味:${prod.hobby}</p>
        ${prod.memo ? `<p class="profile-meta">備考:${prod.memo}</p>` : ''}
      </div>
    </div>
    <div class="section-title">現在・今後の担当番組</div>
    ${currentHtml}
    <div class="section-title">過去作品(弊社俳優との接点)</div>
    ${worksHtml}
  `;
}

(function(){
  var btn = document.createElement('button');
  btn.id = 'back-to-top';
  btn.type = 'button';
  btn.setAttribute('aria-label', 'ページの上部に戻る');
  btn.innerHTML = '<span class="arrow">&#8593;</span><span>上部に戻る</span>';
  document.body.appendChild(btn);
  btn.addEventListener('click', function(){
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  window.addEventListener('scroll', function(){
    if (window.scrollY > 300) {
      btn.classList.add('show');
    } else {
      btn.classList.remove('show');
    }
  }, { passive: true });
})();

renderBreadcrumb();
renderTop();
</script>
